<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document Viewer · Mahmut Esat Kolay</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .viewer-page {
      min-height: 100vh;
      padding: clamp(12px, 2vw, 28px);
      background-color: var(--chrome);
      background-image: radial-gradient(#111 0.7px, transparent 0.7px);
      background-size: 5px 5px;
    }

    .viewer-window {
      width: 100%;
      max-width: none;
      min-height: calc(100vh - clamp(24px, 4vw, 56px));
      margin: 0;
      display: flex;
      flex-direction: column;
      border: var(--line);
      background: var(--paper);
      box-shadow: 9px 9px 0 #111;
    }

    .viewer-toolbar {
      min-height: 64px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      border-bottom: var(--line);
      background: var(--yellow);
    }

    .viewer-dots {
      white-space: nowrap;
      font: 700 18px "Space Grotesk";
    }

    .viewer-title {
      overflow: hidden;
      margin: 0;
      font: 700 clamp(17px, 2vw, 23px) "Space Grotesk";
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .viewer-action {
      padding: 7px 10px;
      border: 2px solid var(--ink);
      background: #fff;
      color: var(--ink);
      font: 700 13px "Space Grotesk";
      text-decoration: none;
    }

    .viewer-action:hover,
    .viewer-action:focus-visible { background: var(--chrome); }

    .viewer-content {
      flex: 1;
      min-height: 0;
      padding: clamp(10px, 1.5vw, 20px);
    }

    .viewer-document {
      width: 100%;
      height: calc(100vh - 130px);
      min-height: 480px;
      display: block;
      border: var(--line);
      background: #fff;
    }

    .viewer-image {
      width: 100%;
      height: calc(100vh - 130px);
      min-height: 480px;
      display: block;
      border: var(--line);
      background: #fff;
      object-fit: contain;
    }

    .viewer-fallback {
      padding: 30px;
      font-weight: 700;
    }

    .viewer-error {
      max-width: 720px;
      margin: 10vh auto;
      padding: 30px;
      border: var(--line);
      background: var(--pink);
      box-shadow: 7px 7px 0 #111;
    }

    .viewer-error h2 { margin-top: 0; font-family: "Space Grotesk"; }

    [hidden] { display: none !important; }

    @media (max-width: 720px) {
      .viewer-toolbar {
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
      }

      .viewer-actions { grid-column: 1 / -1; justify-content: flex-start; }
      .viewer-document,
      .viewer-image { height: calc(100vh - 180px); min-height: 380px; }
    }
  </style>
</head>
<body class="viewer-page">
  <main class="viewer-window" aria-labelledby="viewer-title">
    <header class="viewer-toolbar">
      <span class="viewer-dots" aria-hidden="true">○ ○</span>
      <h1 class="viewer-title" id="viewer-title">Document Viewer</h1>
      <nav class="viewer-actions" aria-label="Document actions">
        <button class="viewer-action" id="viewer-back" type="button">Back</button>
        <a class="viewer-action" id="viewer-original" href="#" target="_blank" rel="noopener">Open original ↗</a>
        <a class="viewer-action" id="viewer-download" href="#" download>Download ↓</a>
      </nav>
    </header>

    <section class="viewer-content" id="viewer-content">
      <object class="viewer-document" id="viewer-document" type="application/pdf">
        <p class="viewer-fallback">This browser cannot display PDFs here. <a id="viewer-fallback-link" href="#">Open the original document.</a></p>
      </object>
      <img class="viewer-image" id="viewer-image" alt="" hidden>

      <div class="viewer-error" id="viewer-error" hidden>
        <h2>Document refused</h2>
        <p>This viewer only opens supported local files stored inside the document or certificate asset directories.</p>
        <a class="viewer-action" href="index.html#documents">Return to Documents</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    (() => {
      const parameters = new URLSearchParams(window.location.search);
      const file = parameters.get("file") || "";
      const requestedTitle = parameters.get("title") || "Document Viewer";
      const pathSegments = file.split("/");
      const extension = file.split(".").pop().toLowerCase();
      const allowedRoot = file.startsWith("assets/documents/") ||
        file.startsWith("assets/certificates/");
      const isPdf = extension === "pdf";
      const isImage = ["png", "jpg", "jpeg", "webp"].includes(extension);
      const validAssetFile = allowedRoot &&
        (isPdf || isImage) &&
        !/[\\\u0000-\u001f\u007f]/.test(file) &&
        !file.includes(":") &&
        !file.includes("?") &&
        !file.includes("#") &&
        !pathSegments.some((segment) => segment === "." || segment === "..");

      const title = document.querySelector("#viewer-title");
      const documentObject = document.querySelector("#viewer-document");
      const image = document.querySelector("#viewer-image");
      const error = document.querySelector("#viewer-error");
      const original = document.querySelector("#viewer-original");
      const download = document.querySelector("#viewer-download");
      const fallback = document.querySelector("#viewer-fallback-link");
      const back = document.querySelector("#viewer-back");

      title.textContent = requestedTitle.slice(0, 120);
      document.title = `${title.textContent} · Document Viewer`;

      back.addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html#documents";
        }
      });

      if (!validAssetFile) {
        documentObject.hidden = true;
        image.hidden = true;
        error.hidden = false;
        original.hidden = true;
        download.hidden = true;
        return;
      }

      if (isPdf) {
        documentObject.data = file;
      } else {
        documentObject.hidden = true;
        image.src = file;
        image.alt = title.textContent;
        image.hidden = false;
      }
      original.href = file;
      download.href = file;
      fallback.href = file;
    })();
  </script>
</body>
</html>
